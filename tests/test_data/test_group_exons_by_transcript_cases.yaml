- test_id: "single_transcript_single_exon"
  gtf_content: |
    FR824046	ena	exon	1244	1570	.	-	.	transcript_id "transcript:T1";
  expected_output:
    "transcript:T1":
      info:
        seqid: "FR824046"
        strand: "-"
      exons:
        - [1244, 1570]

- test_id: "single_transcript_multiple_exons"
  gtf_content: |
    chr1	db	exon	100	200	.	+	.	transcript_id "transcript:T2"; gene_id "G1";
    chr1	db	exon	300	400	.	+	.	transcript_id "transcript:T2"; gene_id "G1";
  expected_output:
    "transcript:T2":
      info:
        seqid: "chr1"
        strand: "+"
      exons: 
        - [100, 200]
        - [300, 400]

- test_id: "multiple_transcripts"
  gtf_content: |
    chrX	ena	exon	10	20	.	-	.	transcript_id "transcript:TA";
    chrX	ena	exon	50	60	.	+	.	transcript_id "transcript:TB";
    chrX	ena	exon	30	40	.	-	.	transcript_id "transcript:TA";
  expected_output:
    "transcript:TA":
      info:
        seqid: "chrX"
        strand: "-"
      exons:
        - [10, 20]
        - [30, 40]
    "transcript:TB":
      info:
        seqid: "chrX"
        strand: "+"
      exons:
        - [50, 60]

- test_id: "empty_gtf"
  gtf_content: "" 
  expected_output: {}

- test_id: "gtf_no_exons"
  gtf_content: |
    chr1	db	gene	100	500	.	+	.	gene_id "G1";
    chr1	db	transcript	100	500	.	+	.	transcript_id "T1"; gene_id "G1";
  expected_output: {}
