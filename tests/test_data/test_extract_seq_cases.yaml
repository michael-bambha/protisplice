# test_cases_extract_sequence.yaml
- test_id: "valid_extraction_middle"
  inputs:
    seq_id: "chr1"
    win_start: 3
    win_end: 7
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
      >chr2
      GATTACA
  expected_sequence: "CTAGC" # 1-based: 3rd char 'C' to 7th char 'C'

- test_id: "valid_extraction_start_of_seq"
  inputs:
    seq_id: "chr1"
    win_start: 1
    win_end: 4
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
  expected_sequence: "AGCT"

- test_id: "valid_extraction_end_of_seq"
  inputs:
    seq_id: "chr1"
    win_start: 9
    win_end: 12
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
  expected_sequence: "AGCT"

- test_id: "valid_extraction_single_base"
  inputs:
    seq_id: "chr1"
    win_start: 5
    win_end: 5
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
  expected_sequence: "A" # 5th char

- test_id: "win_start_greater_than_win_end"
  inputs:
    seq_id: "chr1"
    win_start: 5
    win_end: 4
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
  expected_sequence: ""

- test_id: "win_start_less_than_1_adjusted_valid"
  inputs:
    seq_id: "chr1"
    win_start: 0 # Will be adjusted to 1
    win_end: 3
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
  expected_sequence: "AGC"

- test_id: "win_start_less_than_1_adjusted_invalid"
  inputs:
    seq_id: "chr1"
    win_start: -2 # Will be adjusted to 1
    win_end: 0   # win_start (1) > win_end (0) after adjustment
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
  expected_sequence: ""

- test_id: "seq_id_not_in_fasta"
  inputs:
    seq_id: "chr3" # Not present
    win_start: 1
    win_end: 5
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
      >chr2
      GATTACA
  expected_sequence: ""

- test_id: "win_end_greater_than_seq_len_truncated"
  inputs:
    seq_id: "chr2"
    win_start: 5
    win_end: 10 # seq_len for chr2 is 7
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
      >chr2
      GATTACA
  expected_sequence: "ACA" # Extracts from 5 to 7 (GATT'ACA')

- test_id: "win_start_adjusted_greater_than_win_end_after_truncation"
  inputs:
    seq_id: "chr2"
    win_start: 8 # 1-based
    win_end: 10  # seq_len for chr2 is 7. win_end becomes 7.
                 # win_start (8) > win_end (7)
    fasta_content: |
      >chr2
      GATTACA
  expected_sequence: ""

- test_id: "win_start_equals_win_end_after_truncation_valid_single_base"
  inputs:
    seq_id: "chr2"
    win_start: 7
    win_end: 10 # seq_len for chr2 is 7. win_end becomes 7.
    fasta_content: |
      >chr2
      GATTACA
  expected_sequence: "A" # Extracts base at index 7

- test_id: "zero_length_window_after_0_based_conversion"
  inputs: # e.g. win_start=5, win_end=4 (1-based) -> 0-based start=4, 0-based end=4
    seq_id: "chr1"
    win_start: 5
    win_end: 4 # This is caught by initial `win_start > win_end`
    fasta_content: |
      >chr1
      AGCTAGCTAGCT
  expected_sequence: ""

- test_id: "empty_fasta_content_seq_id_not_found"
  inputs:
    seq_id: "chr1"
    win_start: 1
    win_end: 5
    fasta_content: "" # Empty FASTA file content
  expected_sequence: "" # seq_id will not be in references

- test_id: "fasta_with_only_other_seqs"
  inputs:
    seq_id: "target_seq"
    win_start: 1
    win_end: 2
    fasta_content: |
      >another_seq1
      AGCT
      >another_seq2
      TCGA
  expected_sequence: ""

- test_id: "win_start_is_seq_len_win_end_is_seq_len"
  inputs:
    seq_id: "short"
    win_start: 4 # seq_len of "short" is 4
    win_end: 4   # seq_len of "short" is 4
    fasta_content: |
      >short
      GCTA
  expected_sequence: "A"

- test_id: "win_start_is_1_win_end_is_0_invalid" # win_start > win_end
  inputs:
    seq_id: "chr1"
    win_start: 1
    win_end: 0
    fasta_content: |
      >chr1
      AGCT
  expected_sequence: ""
