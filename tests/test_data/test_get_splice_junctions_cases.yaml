# test_cases_splice_junctions.yaml
- test_id: "no_transcripts"
  input_transcripts: {}
  expected_junctions: []

- test_id: "single_transcript_single_exon"
  input_transcripts:
    "T1":
      info:
        seqid: "chr1"
        strand: "+"
      exons:
        - [100, 200] 
  expected_junctions: []

- test_id: "single_transcript_two_exons_positive_strand"
  input_transcripts:
    "T1":
      info:
        seqid: "chr1"
        strand: "+"
      exons:
        - [100, 200]
        - [300, 400]
  expected_junctions:
    # Exon 0: [100, 200], Exon 1: [300, 400] (sorted)
    # Acceptor for Exon 1 (index 1)
    - id: "T1_acceptor_1"
      seqid: "chr1"
      coord: 300 # exon_start of exon 1
      strand: "+"
      type: "acceptor"
    # Donor from Exon 0 (index 0)
    - id: "T1_donor_0"
      seqid: "chr1"
      coord: 200 # exon_end of exon 0
      strand: "+"
      type: "donor"

- test_id: "single_transcript_two_exons_negative_strand"
  input_transcripts:
    "T1":
      info:
        seqid: "chr1"
        strand: "-"
      exons:
        - [100, 200]
        - [300, 400]
  expected_junctions:
    # Exon 0: [100, 200], Exon 1: [300, 400] (sorted)
    # Acceptor for Exon 1 (index 1)
    - id: "T1_acceptor_1"
      seqid: "chr1"
      coord: 400 # exon_end of exon 1
      strand: "-"
      type: "acceptor"
    # Donor from Exon 0 (index 0)
    - id: "T1_donor_0"
      seqid: "chr1"
      coord: 100 # exon_start of exon 0
      strand: "-"
      type: "donor"

- test_id: "single_transcript_three_exons_positive_strand"
  input_transcripts:
    "T2":
      info:
        seqid: "chr2"
        strand: "+"
      exons:
        - [1000, 1100] # Exon 0
        - [1200, 1300] # Exon 1
        - [1400, 1500] # Exon 2
  expected_junctions:
    # Acceptor for Exon 1 (index 1)
    - id: "T2_acceptor_1"
      seqid: "chr2"
      coord: 1200
      strand: "+"
      type: "acceptor"
    # Donor from Exon 0 (index 0)
    - id: "T2_donor_0"
      seqid: "chr2"
      coord: 1100
      strand: "+"
      type: "donor"
    # Acceptor for Exon 2 (index 2)
    - id: "T2_acceptor_2"
      seqid: "chr2"
      coord: 1400
      strand: "+"
      type: "acceptor"
    # Donor from Exon 1 (index 1)
    - id: "T2_donor_1"
      seqid: "chr2"
      coord: 1300
      strand: "+"
      type: "donor"

- test_id: "single_transcript_three_exons_negative_strand"
  input_transcripts:
    "T3":
      info:
        seqid: "chr3"
        strand: "-"
      exons:
        - [2000, 2100] # Exon 0
        - [2200, 2300] # Exon 1
        - [2400, 2500] # Exon 2
  expected_junctions:
    # Acceptor for Exon 1 (index 1)
    - id: "T3_acceptor_1"
      seqid: "chr3"
      coord: 2300 # exon_end of Exon 1
      strand: "-"
      type: "acceptor"
    # Donor from Exon 0 (index 0)
    - id: "T3_donor_0"
      seqid: "chr3"
      coord: 2000 # exon_start of Exon 0
      strand: "-"
      type: "donor"
    # Acceptor for Exon 2 (index 2)
    - id: "T3_acceptor_2"
      seqid: "chr3"
      coord: 2500 # exon_end of Exon 2
      strand: "-"
      type: "acceptor"
    # Donor from Exon 1 (index 1)
    - id: "T3_donor_1"
      seqid: "chr3"
      coord: 2200 # exon_start of Exon 1
      strand: "-"
      type: "donor"

- test_id: "multiple_transcripts"
  input_transcripts:
    "T_A":
      info:
        seqid: "chrX"
        strand: "+"
      exons:
        - [50, 150]
        - [250, 350]
    "T_B":
      info:
        seqid: "chrY"
        strand: "-"
      exons:
        - [600, 700]
        - [800, 900]
        - [1000, 1100]
  expected_junctions:
    # For T_A
    - id: "T_A_acceptor_1"
      seqid: "chrX"
      coord: 250
      strand: "+"
      type: "acceptor"
    - id: "T_A_donor_0"
      seqid: "chrX"
      coord: 150
      strand: "+"
      type: "donor"
    # For T_B
    - id: "T_B_acceptor_1"
      seqid: "chrY"
      coord: 900
      strand: "-"
      type: "acceptor"
    - id: "T_B_donor_0"
      seqid: "chrY"
      coord: 600
      strand: "-"
      type: "donor"
    - id: "T_B_acceptor_2"
      seqid: "chrY"
      coord: 1100
      strand: "-"
      type: "acceptor"
    - id: "T_B_donor_1"
      seqid: "chrY"
      coord: 800
      strand: "-"
      type: "donor"

- test_id: "transcript_unsorted_exons_positive_strand"
  input_transcripts:
    "T_unsorted_pos":
      info:
        seqid: "chrM"
        strand: "+"
      exons: # Exons are intentionally out of order
        - [500, 600] # Will be Exon 1 after sorting
        - [100, 200] # Will be Exon 0 after sorting
  expected_junctions:
    # Sorted: Exon 0: [100, 200], Exon 1: [500, 600]
    # Acceptor for Exon 1 (index 1)
    - id: "T_unsorted_pos_acceptor_1"
      seqid: "chrM"
      coord: 500
      strand: "+"
      type: "acceptor"
    # Donor from Exon 0 (index 0)
    - id: "T_unsorted_pos_donor_0"
      seqid: "chrM"
      coord: 200
      strand: "+"
      type: "donor"

- test_id: "transcript_unsorted_exons_negative_strand"
  input_transcripts:
    "T_unsorted_neg":
      info:
        seqid: "chrM"
        strand: "-"
      exons: # Exons are intentionally out of order
        - [800, 900]  # Will be Exon 1 after sorting
        - [300, 400]  # Will be Exon 0 after sorting
        - [1200, 1300] # Will be Exon 2 after sorting
  expected_junctions:
    # Sorted: Exon 0: [300, 400], Exon 1: [800, 900], Exon 2: [1200, 1300]
    # Acceptor for Exon 1 (index 1)
    - id: "T_unsorted_neg_acceptor_1"
      seqid: "chrM"
      coord: 900 # exon_end of Exon 1
      strand: "-"
      type: "acceptor"
    # Donor from Exon 0 (index 0)
    - id: "T_unsorted_neg_donor_0"
      seqid: "chrM"
      coord: 300 # exon_start of Exon 0
      strand: "-"
      type: "donor"
    # Acceptor for Exon 2 (index 2)
    - id: "T_unsorted_neg_acceptor_2"
      seqid: "chrM"
      coord: 1300 # exon_end of Exon 2
      strand: "-"
      type: "acceptor"
    # Donor from Exon 1 (index 1)
    - id: "T_unsorted_neg_donor_1"
      seqid: "chrM"
      coord: 800 # exon_start of Exon 1
      strand: "-"
      type: "donor"