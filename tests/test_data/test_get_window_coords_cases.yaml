# test_get_window_coords_cases.yaml
- test_id: "plus_strand_donor_basic"
  inputs:
    strand: "+"
    junc_type: "donor"
    coord: 100
    n_exon: 10
    n_intron: 20
  expected_window: [91, 120] # (100 - 10 + 1, 100 + 20)

- test_id: "plus_strand_acceptor_basic"
  inputs:
    strand: "+"
    junc_type: "acceptor"
    coord: 200
    n_exon: 15
    n_intron: 25
  expected_window: [175, 214] # (200 - 25, 200 + 15 - 1)

- test_id: "minus_strand_donor_basic"
  inputs:
    strand: "-"
    junc_type: "donor"
    coord: 300
    n_exon: 12
    n_intron: 18
  expected_window: [282, 311] # (300 - 18, 300 + 12 - 1)

- test_id: "minus_strand_acceptor_basic"
  inputs:
    strand: "-"
    junc_type: "acceptor"
    coord: 400
    n_exon: 8
    n_intron: 22
  expected_window: [393, 422] # (400 - 8 + 1, 400 + 22)

- test_id: "plus_strand_donor_small_n_exon"
  inputs:
    strand: "+"
    junc_type: "donor"
    coord: 50
    n_exon: 1 # Smallest meaningful n_exon
    n_intron: 5
  expected_window: [50, 55] # (50 - 1 + 1, 50 + 5)

- test_id: "plus_strand_acceptor_small_n_intron"
  inputs:
    strand: "+"
    junc_type: "acceptor"
    coord: 60
    n_exon: 5
    n_intron: 1 # Smallest meaningful n_intron
  expected_window: [59, 64] # (60 - 1, 60 + 5 - 1)

- test_id: "minus_strand_donor_zero_n_intron"
  inputs:
    strand: "-"
    junc_type: "donor"
    coord: 70
    n_exon: 10
    n_intron: 0 # Zero n_intron
  expected_window: [70, 79] # (70 - 0, 70 + 10 - 1)

- test_id: "minus_strand_acceptor_zero_n_exon"
  inputs:
    strand: "-"
    junc_type: "acceptor"
    coord: 80
    n_exon: 0 # Zero n_exon
    n_intron: 10
  expected_window: [81, 90] # (80 - 0 + 1, 80 + 10)

- test_id: "plus_strand_donor_n_exon_equals_coord"
  inputs:
    strand: "+"
    junc_type: "donor"
    coord: 20
    n_exon: 20
    n_intron: 5
  expected_window: [1, 25] # (20 - 20 + 1, 20 + 5)

- test_id: "plus_strand_acceptor_coord_plus_n_exon_edge"
  inputs:
    strand: "+"
    junc_type: "acceptor"
    coord: 30
    n_exon: 1 # Results in win_end = coord
    n_intron: 5
  expected_window: [25, 30] # (30 - 5, 30 + 1 - 1)

- test_id: "invalid_junc_type_should_return_none_none" # Assuming unhandled junc_type returns (None, None)
  inputs:
    strand: "+"
    junc_type: "unknown"
    coord: 100
    n_exon: 10
    n_intron: 10
  expected_window: [null, null] # Representing (None, None) in YAML

- test_id: "invalid_strand_should_return_none_none" # Assuming unhandled strand returns (None, None)
  inputs:
    strand: "x"
    junc_type: "donor"
    coord: 100
    n_exon: 10
    n_intron: 10
  expected_window: [null, null] # Representing (None, None) in YAML
